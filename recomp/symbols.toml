# Bank $00B1 — movers / items / elevators (stage-prop whitelist is meta-gated)
#   $C382 — hazard stripe + brown body (most common pin)
#   $C39E — ledge/handoff prop (1118,490 forever-lock catalog)
#   $C6A4 — on-mech backpack pickup (dx≈±4,dy≈−14, $E4×2) OR free mover;
#           brown latch only when free (not near mech). NOT the giant stand.
#   $C400 $C5F2 $C3EC $C3C4 — other whitelist movers
#   $D5B8 — BG2 elevator (NOT stage-prop whitelist; elevs[] coldump)
