# Sim vs present split (host, not guest WRAM):
#   Sim authority — ObjectListHead + world_x/y on MwObject (+ map collision)
#   Present — sticky OAM (home-only for whitelist) + BG1 from shared $7F
#             + host brown latch/paint (VRAM only; see pool notes above)
#   Stand platform with collision but no near prop / present.n=0:
#     collision = guest sim; visible brown = BG1 present strip (view-rel+$fine HOFS).
#   Map-brown swim with no near prop ⇒ strip/present/$7F path (§9 #16),
#   not $C6A4 / orphan $62 OAM glue.
# Sticky OAM tile ids (coldump tiles[].t / plat.stripe.t):
