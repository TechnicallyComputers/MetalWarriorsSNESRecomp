# Meta / bank catalog (not WRAM — documented for coldump + host filters)
# Decimal coldump m= : $C6A4=50852, $C382=50050, $C38C=50060, $C39E=50078,
#   $E442=58434, $D5B8=54712. Soak suspects: docs/H2H_STAGE_PROPS.md §8a.
