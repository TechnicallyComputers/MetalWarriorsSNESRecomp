# Metal Warriors (USA) — progressive symbol map (partial decomp)
#
# Source of truth for function / site / WRAM / struct labels.
# Run:  python3 tools/sync_symbols.py
# Then: bash tools/regen.sh --no-tests   (regen.sh calls sync first)
#
# [[func]]     — routine entry. emit=true → bankXX.cfg `func` line → named AOT C.
# [[site]]     — mid-function opcode / hook PC (never emitted as a func).
# [[site_group]] — named list of site PCs (arrays in mw_symbols.h).
# [[object]]   — WRAM / globals.
# [[struct]] / [[field]] — guest layouts (documented + C typedefs in header).
#
# status: guessed | confirmed | hot
# Prefer naming function ENTRIES, not every CMP/BMI site. Sites stay as sites.

