# Observed H2H elev-room identities (coldump; pool slots recycle — do NOT
# hardcode these WRAM addresses in host logic):
#   $1A68 / $6760 — pool slots that host $C6A4 (meta recycles; not stable IDs)
#   $1A14 — dual mech body meta $E442 / bank $00AD
#   $19C0 — mech sub-object $E30E-class / $00AD (~2–3px off body)
#   $C382 pins — mid-ledge (637|832,365), upstairs (220|1249,106),
#      crate (220,621); hazard stripe+brown. Host: mw_prop_is_pinned_hazard.
#   Soak suspects + manip queue: docs/H2H_STAGE_PROPS.md §8a / §8b.
#
# Giant hazard stand (FOV grid-snap) — soak suspects 2026-08-05:
#   BEST: map collision + BG1 (feet often sky). NOT catalog pins.
#   $C382 @ (637|832,365)/(220,106) — RULED OUT (manip); PROP_PIN_DY unset
#      (regressed walls/items). Do not reuse pin FP as stand probe.
#   (350,490) — meta recycles $C39E/$C3EC; list-prop probe skipped (not stand).
#   $C38C (m=50060) bank $B1 item @ dy≈−14 on $1A68 — backpack-class when
#      present. Not the stand.
#   Mech $E442/$AD — body CHR.
#   STAND MAP/BG1 probe (current): SNESRECOMP_MW_STAND_BG1=dump|mark|blank
#      + coldump stand_bg1. Present-only; no FP/gap-fill/CHR allowlist.
#   Absent: $62/$C8 hzd, $D5B8 elev, $C6A4 meta in props.
#
# $C6A4 (m=50852) — TWO roles (same meta; distinguish by geometry):
#   1) ON-MECH PICKUP / backpack (common under P2 in chase dumps):
#      near[] dx≈±4, dy≈−14; sticky $E4×2 (mox 0/−15, moy −10); origin
#      t7f=$0200 (sky — no brown body). Present MUST follow live so OAM
#      stays on the mech back. World-locking this tore the pickup off
#      (use stuck far, oam off-screen, present.n→0). Pool $1A68 may
#      show sibling meta $C38C (50060) with the same backpack geometry.
#   2) Free-floating mover (not within ±48x/±32y of either mech): keep
#      world-lock X+Y through cam_corr / remote; sticky $E4 only; brown
#      latch only when not on-mech.
# Giant hazard stand is NOT $C6A4 / $C38C backpack — BG1/map (plat.pres).
# Feet / plat.coll = collision gate only; present origin varies (odx/ody).
# plat.pres scores contiguous $7F/VRAM runs near coll + on-screen (not
# widest far shelf — dump false latch west=896 odx=167 sx=342).
# plat.stripe = $62/$C8 hazard OAM only (never $E4 backpack).
# Lag: pres_world (d_pres_wx≈0) vs pres_lock (d_pres_wx≈dloc) while |dloc|≥2.
#
# GRID-SNAP STAND — collision ≠ paint (2026-08-05):
#   Do NOT locate paint under mech feet. Feet sky / plat.under empty at coll
#   only proves the split. Coldump paint{}: FOV BG1 cands + focus.lag
#   (lock=FOV-follow, world=world-lock) and paint.oam[] — no feet gate.
#   Identify which cand/oam is the circled hitching layer, then marry to coll.
#   mw_bg1_vram_at_world: world tile row; view-rel X full-frame.
#
# FALSE LEAD (2026-08-05) — DO NOT revive CHR allowlist world-lock:
#   Untagged poam t=$0A/$0C/$0E/$20/$22/$28/$40… under P2 feet with s:0 looked
#   like "stand platform" when present.n=0 / no list prop. Those tiles are
#   MECH body CHR (bank $00AD / meta $E442) — same cluster as $06/$08/$E4/$E6.
#   Capture world-lock by tile id froze half the mech (sliced presentation).
#   Identify platform present by object (whitelist meta / local_only / sticky
#   $E4) or BG1/$7F map-brown — never raw tile-id allowlists on untagged OAM.
#
# Host-present paint (display-only — NOT sim collision):
#   mw_rider_brown_paint → mw_bg1_paint_world writes BG1 VRAM only.
#   Eligible: free (not on-mech) $C6A4 + pinned $C382. On-mech backpack
#   clears brown latch. Pins paint catalog +$02/+$04 only. Scrub prior paint
#   on XY move; clear on foreign home / sticky death. plat.stripe: $62/$C8 only.
#   Mid-ledge neither-FOV → closer |sy|. Pin paint skip far_y.
#   Gameplay OAM skips tiles latched in prop sticky (sticky path only).

