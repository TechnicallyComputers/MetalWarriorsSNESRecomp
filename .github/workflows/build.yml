# Build Metal Warriors for Linux, Windows, macOS (arm64 + Intel).
# Does not ship the SNES ROM in the player zip.
#
# Requires:
#   - Secret CI_ASSETS_TOKEN: fine-grained PAT with Contents:Read on
#     TechnicallyComputers/psxrecomp-ci-assets (same secret as MotK).
#     That repo supplies metalwarriors/src-gen.zip (prebuilt src/gen/*.c).
#     Refresh locally: bash tools/publish_ci_src_gen.sh
#     No ROM is stored in CI assets. Players pick their own ROM at launch.
#
# Framework deps use this repository's exact gitlink pins:
#   - snesrecomp at the game root (owns nested lib/recomp-net)
#   - recomp-ui at the game root
#
# Triggers:
#   - pull_request / push to main (compile + artifact upload)
#   - workflow_dispatch (manual)
#   - push tags matching v* (also publishes a GitHub Release)

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: mw-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: linux-x64
            shell: bash
          - os: windows-2022
            artifact: windows-x64
            shell: 'msys2 {0}'
          - os: macos-15
            artifact: macos-arm64
            shell: bash
            deployment_target: '11.0'
          - os: macos-15-intel
            artifact: macos-x64
            shell: bash
            deployment_target: '11.0'

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Record pinned framework revisions
        shell: bash
        run: |
          set -euo pipefail
          echo "snesrecomp=$(git -C snesrecomp rev-parse --short HEAD) ($(git -C snesrecomp rev-parse HEAD))"
          echo "recomp-ui=$(git -C recomp-ui rev-parse --short HEAD)"
          echo "recomp-net=$(git -C snesrecomp/lib/recomp-net rev-parse --short HEAD)"

      # Download only metalwarriors/src-gen.zip via the API (no full-repo
      # checkout). Avoids actions/checkout failing with an empty token when
      # CI_ASSETS_TOKEN is missing, and skips MotK LFS disc/BIOS blobs.
      - name: Install generated C from src-gen.zip
        shell: bash
        env:
          CI_ASSETS_TOKEN: ${{ secrets.CI_ASSETS_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CI_ASSETS_TOKEN}" ]]; then
            echo "::error::Repository secret CI_ASSETS_TOKEN is missing or empty."
            echo "Add a fine-grained PAT with Contents: Read on"
            echo "  TechnicallyComputers/psxrecomp-ci-assets"
            echo "(same secret MotK uses). Fork PRs cannot read this secret —"
            echo "run the workflow from the main repo (push / workflow_dispatch)."
            exit 1
          fi

          ASSET_URL="https://api.github.com/repos/TechnicallyComputers/psxrecomp-ci-assets/contents/metalwarriors/src-gen.zip"
          GEN_ZIP="${RUNNER_TEMP:-${TMPDIR:-/tmp}}/mw-src-gen.zip"
          # Do not use curl -f: we need the HTTP status for a clear error.
          HTTP_CODE="$(curl -sS -L -o "${GEN_ZIP}" -w '%{http_code}' \
            -H "Authorization: Bearer ${CI_ASSETS_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${ASSET_URL}" || echo "000")"
          if [[ "${HTTP_CODE}" != "200" ]]; then
            echo "::error::failed to download metalwarriors/src-gen.zip (HTTP ${HTTP_CODE})"
            echo "Check CI_ASSETS_TOKEN Contents:Read on psxrecomp-ci-assets, and that"
            echo "metalwarriors/src-gen.zip exists (bash tools/publish_ci_src_gen.sh)."
            rm -f "${GEN_ZIP}"
            exit 1
          fi
          SZ="$(wc -c < "${GEN_ZIP}" | tr -d '[:space:]')"
          if [[ "${SZ}" -lt 100 ]]; then
            echo "::error::src-gen.zip is only ${SZ} bytes — download looks wrong"
            rm -f "${GEN_ZIP}"
            exit 1
          fi

          mkdir -p src/gen
          if command -v python3 >/dev/null 2>&1; then PY=python3; else PY=python; fi
          GEN_ZIP="${GEN_ZIP}" "${PY}" - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          zpath = Path(os.environ["GEN_ZIP"])
          dest = Path("src/gen")
          with zipfile.ZipFile(zpath) as zf:
              zf.extractall(dest)
          nested = dest / "src" / "gen"
          if nested.is_dir():
              for p in nested.iterdir():
                  p.rename(dest / p.name)
          banks = list(dest.glob("*.c"))
          if not banks:
              raise SystemExit(f"src-gen.zip had no .c files: {sorted(dest.iterdir())}")
          print(f"Installed {len(banks)} generated .c files ({zpath.stat().st_size} bytes)")
          PY
          rm -f "${GEN_ZIP}"

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL3
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-python
            zip

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libsdl3-dev libgl1-mesa-dev python3 zip

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config sdl3 dylibbundler zip

      - name: Configure & build
        env:
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target || '' }}
        run: |
          set -euo pipefail
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXTRA=()
          if [[ -n "${CMAKE_OSX_DEPLOYMENT_TARGET:-}" ]]; then
            EXTRA+=("-DCMAKE_OSX_DEPLOYMENT_TARGET=${CMAKE_OSX_DEPLOYMENT_TARGET}")
          fi
          JOBS="$(nproc 2>/dev/null || sysctl -n hw.ncpu 2>/dev/null || echo 4)"
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DSNESRECOMP_ENABLE_TRACE=OFF \
            -DSNESRECOMP_NET_ICE=ON \
            -DSNESRECOMP_BUILD_VERSION="${VERSION}" \
            "${EXTRA[@]}"
          cmake --build build-ci --target MetalWarriorsSNESRecomp -j"${JOBS}"

      - name: Package
        run: |
          set -euo pipefail
          chmod +x scripts/package_release.sh
          scripts/package_release.sh build-ci "${{ matrix.artifact }}"
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: metalwarriors-${{ matrix.artifact }}
          path: dist/metalwarriors-*-${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: false

      - name: Flatten zips
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f -name 'metalwarriors-*.zip' -exec cp -v {} dist/ \;
          ls -la dist/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/metalwarriors-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
